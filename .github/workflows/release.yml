name: Build Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Build self-contained companion
        shell: pwsh
        run: >-
          dotnet publish app/DfoHotbarCompanion.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFO-Hotbar-Companion-win-x64
          path: publish/DFO Hotbar Companion.exe

      - name: Publish v0.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: DFO Hotbar Companion v0.1.0
          generate_release_notes: true
          files: publish/DFO Hotbar Companion.exe
